plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sqrock.smarthome'
    compileSdk 34

    defaultConfig {
        applicationId "com.sqrock.smarthome"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The app only uses the Android framework (SQLite, SharedPreferences, programmatic Views), so it has no third-party dependencies.
dependencies {
}
